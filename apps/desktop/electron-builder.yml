appId: com.autonomousqa.desktop
productName: 관리자웹 자율 QA
copyright: ""

directories:
  output: release
  buildResources: build

# asar 안에는 앱 코드만 넣는다.
# 엔진과 브라우저는 자식 프로세스가 **실제 파일 경로**로 접근해야 하므로
# extraResources 로 asar 밖에 둔다.
files:
  - dist/electron/**
  - dist/renderer/**
  - package.json
  # 번들에서 제외한 네이티브·wasm 모듈만 남긴다.
  - node_modules/node-sqlite3-wasm/**

extraResources:
  - from: resources/engine
    to: engine
  - from: resources/browsers
    to: browsers
  # 앱 QA 용 adb. 엔진이 자식 프로세스로 실행하므로 asar 밖이어야 한다.
  - from: resources/platform-tools
    to: platform-tools

asar: true
# 브라우저는 extraResources라 애초에 asar 밖이지만, 혹시 모를 압축을 막는다.
asarUnpack:
  - node_modules/node-sqlite3-wasm/**

win:
  # 아이콘은 scripts/make-icon.mjs 가 AI_QA_icon_15KB.jpg 에서 만든다.
  # 256~16px 를 한 파일에 담아야 작업 표시줄과 탐색기에서 뭉개지지 않는다.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # 서명은 사내 배포 정책이 정해지면 붙인다. 인증서가 없으면 electron-builder 가
  # 알아서 건너뛴다. signAndEditExecutable: false 로 끄면 안 된다 —
  # 그 스위치는 서명뿐 아니라 **아이콘·버전정보 삽입까지** 막는다.
  # 실측에서 이것 때문에 아이콘을 지정했는데도 기본 Electron 아이콘이 나왔다.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 관리자웹 자율 QA
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # 풀 크로미움을 동봉하므로 원본이 400MB를 넘는다. 최대 압축으로 설치 파일을 줄인다.
  differentialPackage: false

compression: maximum

# 사용자 데이터(qa.db, runs/)는 설치 폴더가 아니라 userData 로 간다.
# 프로그램 폴더는 쓰기 권한이 없을 수 있고, 재설치 때 지워진다.
